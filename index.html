/* Sections */
section { padding: 2.75rem 0 0.5rem; }

/* ============================================================
   RENDER — no need to touch below for content changes.
   ============================================================ */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const has = v => Array.isArray(v) ? v.length > 0 : Boolean(v);
const fmtDate = ym => {
  if (!ym) return "";
  const [y, m] = ym.split("-").map(Number);
  return m ? new Date(y, m - 1).toLocaleDateString("en-US", { month: "long", year: "numeric" }) : String(y);
};
const link = (url, text) => has(url) ? `<a href="${esc(url)}"${/^https?:/.test(url) ? ' target="_blank" rel="noopener"' : ""}>${esc(text)}</a>` : "";
const byDateDesc = arr => [...arr].sort((a, b) => (b.date || "").localeCompare(a.date || ""));

function masthead() {
  const social = SITE.social.filter(s => has(s.url)).map(s => link(s.url, s.label)).join("");
  return `<header class="masthead">
    <h1><a href="#about" style="color:inherit;text-decoration:none">${esc(SITE.name)}</a></h1>
    ${has(SITE.tagline) ? `<p class="tagline">${esc(SITE.tagline)}</p>` : ""}
    ${social ? `<div class="social">${social}</div>` : ""}
  </header>`;
}

function nav() {
  const items = [["about", "About"], ["writing", "Writing"], ["projects", "Projects"], ["adventures", "Adventures"], ["consume", "Consume"]];
  return `<nav class="sections" aria-label="Sections">${items.map(([id, l]) => `<a href="#${id}">${l}</a>`).join("")}</nav>`;
}

function about() {
  const photo = has(SITE.photo) ? `<img src="${esc(SITE.photo)}" alt="Photo of ${esc(SITE.name)}">` : "Add a photo in SITE.photo";
  return `<section id="about" aria-label="About">
    <div class="about">
      <div class="photo">${photo}</div>
      <div>
        ${SITE.bio.map(p => `<p>${esc(p)}</p>`).join("")}
        <p class="more">${has(SITE.email) ? `<a href="mailto:${esc(SITE.email)}">${esc(SITE.email)}</a>` : ""}${has(SITE.email) && has(SITE.phone) ? `&ensp;` : ""}${has(SITE.phone) ? `<a href="tel:${esc(SITE.phone.replace(/\s/g, ""))}">${esc(SITE.phone)}</a>` : ""}</p>
      </div>
    </div>
  </section>`;
}

function writing() {
  const fmtShort = ym => { if (!ym) return ""; const [y, m] = ym.split("-"); return m ? `${m}/${y.slice(2)}` : y; };
  return `<section id="writing">
    <h2>Writing</h2>
    ${has(SITE.substack) ? `<p class="ext-link" style="margin:0 0 1rem">${link(SITE.substack, "Substack")}</p>` : ""}
    ${byDateDesc(SITE.writing).map(w => `<article class="entry">
      <h3>${esc(w.title)}${has(w.date) ? `<span class="inline-date">${esc(fmtShort(w.date))}</span>` : ""}</h3>
      ${has(w.dek) ? `<p class="entry-dek">${esc(w.dek)}</p>` : ""}
      ${has(w.url) ? `<p class="ext-link"><a href="${esc(w.url)}" target="_blank" rel="noopener">Link \u2197</a></p>` : ""}
    </article>`).join("")}
  </section>`;
}

function projects() {
  const fmtShort = ym => { if (!ym) return ""; const [y, m] = ym.split("-"); return m ? `${m}/${y.slice(2)}` : y; };
  const privateRepos = ["https://github.com/philipsantiago/DailyHabit"];
  return `<section id="projects">
    <h2>Projects</h2>
    ${byDateDesc(SITE.projects).map(p => {
      const dateParts = [fmtShort(p.date), p.status].filter(Boolean).join("  ");
      const showGithub = has(p.github) && !privateRepos.includes(p.github);
      const links = [showGithub ? `<a href="${esc(p.github)}" target="_blank" rel="noopener">GitHub</a>` : "", has(p.live) ? `<a href="${esc(p.live)}" target="_blank" rel="noopener">Live</a>` : ""].filter(Boolean).join("");
      return `<article class="entry">
      <h3>${esc(p.title)}${dateParts ? `<span class="inline-date">${esc(dateParts)}</span>` : ""}</h3>
      ${has(p.dek) ? `<p class="entry-dek">${esc(p.dek)}</p>` : ""}
      ${links ? `<p class="ext-link">${links}</p>` : ""}
    </article>`;}).join("")}
  </section>`;
}

function adventures() {
  const realMedia = arr => arr.filter(Boolean);
  const isVideo = src => /\.(mov|mp4|m4v|webm)$/i.test(src);
  return `<section id="adventures">
    <h2>Adventures</h2>
    <p class="dek">\u201cNot all those who wander are lost.\u201d \u2014 J.R.R. Tolkien</p>
    ${SITE.adventures.map((a, idx) => {
      const media = realMedia(a.photos);
      return `<article class="entry">
      <h3>${esc(a.title)}</h3>
      ${has(a.subtitle) ? `<p class="meta">${esc(a.subtitle)}</p>` : ""}
      ${has(a.body) ? `<p class="entry-dek">${esc(a.body)}</p>` : ""}
      ${has(a.why) ? `<p class="why">${esc(a.why)}</p>` : ""}
      ${media.length ? `<button class="photos-btn" data-adv="${idx}">View photos (${media.length})</button>` : ""}
    </article>`;}).join("")}
  </section>`;
}

function openLightbox(idx) {
  const a = SITE.adventures[idx];
  const media = a.photos.filter(Boolean);
  const isVideo = src => /\.(mov|mp4|m4v|webm)$/i.test(src);
  document.getElementById("lb-title").textContent = a.title;
  document.getElementById("lb-grid").innerHTML = media.map((src, i) =>
    isVideo(src)
      ? `<video src="${esc(src)}" controls preload="metadata" playsinline></video>`
      : `<a href="${esc(src)}" target="_blank"><img src="${esc(src)}" alt="${esc(a.title)}, photo ${i + 1}" loading="lazy"></a>`
  ).join("");
  const lb = document.getElementById("lightbox");
  lb.classList.add("open");
  lb.scrollTop = 0;
  document.body.style.overflow = "hidden";
}

function closeLightbox() {
  document.getElementById("lightbox").classList.remove("open");
  document.body.style.overflow = "";
}

function consume() {
  const { now, shelves } = SITE.consume;
  const names = Object.keys(shelves).filter(k => has(shelves[k]));
  return `<section id="consume">
    <h2>Consume, consume, consume</h2>
    <p class="dek">What I’m reading, watching, and listening to (consume!). Send recs.</p>
    ${has(now) ? `<div class="now"><h3>Right now</h3><ul>${now.map(n =>
      `<li><span class="kind">${esc(n.kind)}:</span> ${esc(n.title)}${n.by ? `, ${esc(n.by)}` : ""}</li>`).join("")}</ul></div>` : ""}
    <div class="tabs" role="tablist" aria-label="Favorites">${names.map((n, i) =>
      `<button role="tab" id="tab-${i}" aria-controls="shelf" aria-selected="${i === 0}" data-shelf="${esc(n)}">${esc(n)}</button>`).join("")}</div>
    <ul class="shelf" id="shelf" role="tabpanel"></ul>
  </section>`;
}

function renderShelf(name) {
  const items = SITE.consume.shelves[name] || [];
  const el = document.getElementById("shelf");
  if (name === "Movies") {
    el.className = "poster-grid";
    el.innerHTML = items.map(it => {
      if (it.url && it.title === "Letterboxd") {
        return `<li><p class="meta" style="margin:0;grid-column:1/-1">${link(it.url, "Find more on Letterboxd")} <span style="color:var(--muted);font-style:italic">(not fully updated)</span></p></li>`;
      }
      const poster = it.poster ? `<img src="${esc(it.poster)}" alt="${esc(it.title)}" loading="lazy">` : `<div style="aspect-ratio:2/3;background:var(--placeholder)"></div>`;
      return `<li>${poster}<span class="poster-title">${esc(it.title)}</span></li>`;
    }).join("");
  } else {
    el.className = "shelf";
    el.innerHTML = items.map(it => `<li>
      <span class="title">${has(it.url) ? link(it.url, it.title) : esc(it.title)}</span>${it.by ? `<span class="by">, ${esc(it.by)}</span>` : ""}
      ${has(it.note) ? `<span class="note">${esc(it.note)}</span>` : ""}
    </li>`).join("");
  }
}

const VIEWS = ["about", "writing", "projects", "adventures", "consume"];

function showView() {
  const hash = location.hash.slice(1) || "about";
  VIEWS.forEach(id => {
    const el = document.getElementById(id);
    if (el) el.hidden = id !== hash;
  });
  document.querySelectorAll("nav.sections a").forEach(a => {
    a.classList.toggle("active", a.getAttribute("href") === "#" + hash);
  });
  window.scrollTo(0, 0);
}

function render() {
  document.title = SITE.name;
  document.getElementById("app").innerHTML =
    masthead() + nav() + about() + writing() + projects() + adventures() + consume() +
    `<footer>© ${new Date().getFullYear()} ${esc(SITE.name)}</footer>` +
    `<div class="lightbox" id="lightbox"><div class="lightbox-head"><h3 id="lb-title"></h3><button class="lightbox-close">\u00d7</button></div><div class="lightbox-grid" id="lb-grid"></div></div>`;

  const tabs = [...document.querySelectorAll(".tabs button")];
  tabs.forEach(btn => btn.addEventListener("click", () => {
    tabs.forEach(b => b.setAttribute("aria-selected", String(b === btn)));
    document.getElementById("shelf").setAttribute("aria-labelledby", btn.id);
    renderShelf(btn.dataset.shelf);
  }));
  if (tabs[0]) { document.getElementById("shelf").setAttribute("aria-labelledby", tabs[0].id); renderShelf(tabs[0].dataset.shelf); }

  document.querySelectorAll(".photos-btn").forEach(btn => {
    btn.addEventListener("click", () => openLightbox(Number(btn.dataset.adv)));
  });
  document.querySelector(".lightbox-close").addEventListener("click", closeLightbox);
  document.getElementById("lightbox").addEventListener("click", e => {
    if (e.target === e.currentTarget) closeLightbox();
  });

  window.addEventListener("hashchange", showView);
  showView();
}
render();

/* ============================================================
   ANIMATION 1: Subtle ambient dots (persistent background)
   ============================================================ */
(function() {
  const c = document.createElement("canvas");
  c.style.cssText = "position:fixed;top:0;left:0;width:100%;height:100%;z-index:9998;pointer-events:none;";
  document.body.appendChild(c);
  const ctx = c.getContext("2d");
  let w, h, nodes = [];
  const COUNT = 40;

  function resize() { w = c.width = window.innerWidth; h = c.height = window.innerHeight; }
  window.addEventListener("resize", resize); resize();

  for (let i = 0; i < COUNT; i++) {
    nodes.push({ x: Math.random() * w, y: Math.random() * h,
      vx: (Math.random() - 0.5) * 0.2, vy: (Math.random() - 0.5) * 0.2,
      r: Math.random() * 1.2 + 1 });
  }

  function draw() {
    ctx.clearRect(0, 0, w, h);
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        const dx = nodes[i].x - nodes[j].x, dy = nodes[i].y - nodes[j].y;
        const d = Math.sqrt(dx * dx + dy * dy);
        if (d < 140) {
          ctx.beginPath(); ctx.moveTo(nodes[i].x, nodes[i].y);
          ctx.lineTo(nodes[j].x, nodes[j].y);
          ctx.strokeStyle = `rgba(0,0,0,${0.12 * (1 - d / 140)})`;
          ctx.lineWidth = 0.6; ctx.stroke();
        }
      }
    }
    for (const n of nodes) {
      n.x += n.vx; n.y += n.vy;
      if (n.x < 0) n.x = w; if (n.x > w) n.x = 0;
      if (n.y < 0) n.y = h; if (n.y > h) n.y = 0;
      ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(0,0,0,0.3)"; ctx.fill();
    }
    requestAnimationFrame(draw);
  }
  draw();
})();

/* ============================================================
   ANIMATION 2: Code rain intro (plays once on load)
   ============================================================ */
(function() {
  const overlay = document.createElement("div"); overlay.id = "matrix-overlay";
  const mc = document.createElement("canvas"); mc.id = "matrix-canvas";
  overlay.appendChild(mc); document.body.appendChild(overlay);

  const ctx = mc.getContext("2d");
  mc.width = window.innerWidth; mc.height = window.innerHeight;
  const fontSize = 14;
  const cols = Math.floor(mc.width / fontSize);
  const drops = Array(cols).fill(0).map(() => Math.random() * -20 | 0);
  const chars = "0123456789ABCDEFabcdef{}[]<>=>:://→←∞∑∂λπ$%&#@!?+*~^";
  let frame = 0;

  function rain() {
    ctx.fillStyle = "rgba(10, 10, 10, 0.06)";
    ctx.fillRect(0, 0, mc.width, mc.height);
    ctx.font = fontSize + "px 'Courier New', monospace";
    for (let i = 0; i < drops.length; i++) {
      const ch = chars[Math.floor(Math.random() * chars.length)];
      const brightness = 180 + Math.random() * 75;
      ctx.fillStyle = `rgba(${brightness},${brightness},${brightness},${0.6 + Math.random() * 0.4})`;
      ctx.fillText(ch, i * fontSize, drops[i] * fontSize);
      if (drops[i] * fontSize > mc.height && Math.random() > 0.975) drops[i] = 0;
      drops[i]++;
    }
    frame++;
    if (frame < 70) { requestAnimationFrame(rain); }
    else {
      overlay.style.transition = "opacity 1s ease-out"; overlay.style.opacity = "0";
      setTimeout(() => overlay.remove(), 1000);
    }
  }
  rain();
})();
